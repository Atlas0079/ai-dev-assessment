{
  "services": {
    "app": {
      "build": {
        "context": "./GAME",
        "network": "none"
      },
      "ports": [
        "127.0.0.1:8080:8080"
      ],
      "platform": "linux/amd64"
    },
    "public-check": {
      "image": "python:3.13.13-slim-bookworm@sha256:f576b530293e74140ea91d262232648d5c4f45640a95ec447757701bfcacf034",
      "working_dir": "/tools",
      "volumes": [
        "./devtools:/tools:ro"
      ],
      "profiles": [
        "check"
      ],
      "entrypoint": [
        "python",
        "self_check.py",
        "GAME"
      ],
      "command": [
        "--url",
        "http://app:8080"
      ],
      "platform": "linux/amd64",
      "pull_policy": "never"
    }
  }
}
