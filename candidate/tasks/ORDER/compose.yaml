{
  "services": {
    "app": {
      "build": {
        "context": "./ORDER",
        "network": "none"
      },
      "ports": [
        "127.0.0.1:8080:8080"
      ],
      "environment": {
        "MONGO_URI": "mongodb://mongo:27017/assessment"
      },
      "depends_on": {
        "mongo": {
          "condition": "service_healthy"
        }
      },
      "platform": "linux/amd64"
    },
    "public-check": {
      "image": "python:3.13.13-slim-bookworm@sha256:f576b530293e74140ea91d262232648d5c4f45640a95ec447757701bfcacf034",
      "working_dir": "/tools",
      "volumes": [
        "./devtools:/tools:ro"
      ],
      "profiles": [
        "check"
      ],
      "entrypoint": [
        "python",
        "self_check.py",
        "ORDER"
      ],
      "command": [
        "--url",
        "http://app:8080"
      ],
      "platform": "linux/amd64",
      "pull_policy": "never"
    },
    "mongo": {
      "image": "mongo:7.0.16@sha256:a3ba70fe8da14d155e158245fc89a9dd6adf92ae34976ebce24464a3c1573c78",
      "volumes": [
        "order-data:/data/db"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand({ping:1}).ok"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      },
      "platform": "linux/amd64",
      "pull_policy": "never"
    }
  },
  "volumes": {
    "order-data": {}
  }
}
