<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO · 同桌</title><style>body{font:16px system-ui;background:#102e31;color:#eaf7f4;max-width:900px;margin:48px auto;padding:24px}h1{font-size:52px;margin:0}small{color:#83beb5}button,input,select{padding:12px;border:0;border-radius:9px;margin:5px}button{cursor:pointer;background:#daf69b;color:#16302a}#hand button{width:80px;height:115px;font-size:23px;color:white;background:#bc4343;border:3px solid #fff3}section{padding:22px;background:#ffffff0a;border-radius:18px;margin:18px 0}pre{white-space:pre-wrap}#error{color:#ffd399}</style><small>社交游戏 · 参考实现</small><h1>UNO 同桌</h1><section><input id="room" placeholder="房间编号"><button id="create">创建房间</button><button id="join">加入房间</button><button id="ready">准备</button><button id="start">开始游戏</button><p id="identity"></p></section><section><h2 id="status">邀请朋友，开始一局</h2><p id="players"></p><div id="top"></div><div id="hand"></div><select id="color"><option value="R">红</option><option value="Y">黄</option><option value="B">蓝</option><option value="G">绿</option></select><button id="draw">摸牌</button><p id="error"></p></section><script>
let session=JSON.parse(localStorage.getItem('uno')||'{}'),game;
const $=id=>document.getElementById(id);function persist(){localStorage.setItem('uno',JSON.stringify(session));$('room').value=session.roomId||'';$('identity').textContent=session.playerId?'我的座位 '+session.playerId:''}persist();
async function call(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session.playerToken||'')},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.code);return d}
function action(fn){return async()=>{try{$('error').textContent='';await fn()}catch(e){$('error').textContent=e.message}}}
$('create').onclick=action(async()=>{session=await call('/v1/rooms',{displayName:'玩家'});persist()});$('join').onclick=action(async()=>{session=await call('/v1/rooms/'+$('room').value+'/join',{displayName:'玩家'});persist()});$('ready').onclick=action(()=>call('/v1/rooms/'+session.roomId+'/ready',{ready:true,requestId:crypto.randomUUID()}));$('start').onclick=action(async()=>{game=await call('/v1/rooms/'+session.roomId+'/start',{requestId:crypto.randomUUID()});session.gameId=game.gameId;persist();render()});
async function move(type,cardId){game=await call('/v1/games/'+session.gameId+'/actions',{requestId:crypto.randomUUID(),expectedRevision:game.revision,type,cardId,chosenColor:$('color').value});render()}
$('draw').onclick=action(()=>move('DRAW'));
function render(){if(!game)return;$('status').textContent=game.winnerId?'胜者：'+game.winnerId:game.currentPlayerId===session.playerId?'轮到你出牌':'等待其他玩家';$('players').textContent=game.players.map(p=>p.playerId+' · '+p.count+'张').join(' / ');$('top').textContent='桌面：'+game.top.color+' '+game.top.value+' · 当前颜色 '+game.currentColor;$('hand').replaceChildren();for(let c of game.hand){let b=document.createElement('button');b.textContent=c.value;b.dataset.cardId=c.cardId;b.style.background=({R:'#bb4545',B:'#3b70b6',G:'#32826c',Y:'#ad872d',W:'#51466f'})[c.color];b.onclick=action(()=>move('PLAY',c.cardId));$('hand').append(b)}}
setInterval(async()=>{try{if(!session.gameId&&session.roomId){let r=await call('/v1/rooms/'+session.roomId);if(r.gameId){session.gameId=r.gameId;persist()}}if(session.gameId){game=await call('/v1/games/'+session.gameId);render()}}catch(e){}},800);
</script></html>
