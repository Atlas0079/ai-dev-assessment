<!doctype html><html lang="zh"><meta charset="utf-8"><title>订单服务 · 模拟平台</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;background:#f4f6f1;color:#20372e}button,select,input{padding:10px;margin:5px;border:1px solid #ccc;border-radius:6px}section{background:white;padding:25px;border-radius:12px}pre{white-space:pre-wrap}</style><h1>订单服务</h1><p>模拟账号 · 虚构数据 · 无真实支付</p><section><select id="account"><option>customer1</option><option>customer2</option><option>provider1</option><option>provider2</option></select><button id="login">登录</button><button id="create">创建订单</button><button id="list">我的订单</button><input id="order" placeholder="订单编号"><button data-action="accept">接单</button><button data-action="cancel">取消</button><button data-action="complete">完成</button><pre id="result"></pre></section><script>let token='';async function call(path,b,key){let r=await fetch(path,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'Idempotency-Key':key||crypto.randomUUID()},body:b?JSON.stringify(b):undefined});let raw=await r.json();let d=raw.code===0?raw.data:raw;document.getElementById('result').textContent=JSON.stringify(d,null,2);return d}document.getElementById('login').onclick=async()=>{token=(await call('/v1/demo-login',{account:document.getElementById('account').value})).token};document.getElementById('create').onclick=async()=>{document.getElementById('order').value=(await call('/v1/orders',{serviceId:'s1'})).id};document.getElementById('list').onclick=()=>call('/v1/orders');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>call('/v1/orders/'+document.getElementById('order').value+'/'+b.dataset.action,{}));</script></html>
